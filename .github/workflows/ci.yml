name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==24.4.2 isort==5.13.2
      - run: black --check --config pyproject.toml .
      - run: isort --check-only --line-length=120 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the provenance tests walk real history; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/ -q

  drift:
    # Gates on per-kind counts, not the exit code: the existing backlog is allowed, growing it
    # is not. Lower status-baseline.json as findings are fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # get_latest_commit_hash needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction

      # Offline checks only - no RPC, no credentials, fully deterministic.
      - name: Report deployment drift
        run: poetry run python manage.py status --brief || true

      - name: Fail if any check got worse
        run: |
          poetry run python manage.py status --json findings.json || true
          python - <<'PY'
          import collections, json, sys

          baseline = json.load(open(".github/status-baseline.json"))
          current = collections.Counter(f["kind"] for f in json.load(open("findings.json")))

          worse = {k: (baseline.get(k, 0), n) for k, n in current.items() if n > baseline.get(k, 0)}
          better = {k: (b, current.get(k, 0)) for k, b in baseline.items() if current.get(k, 0) < b}

          for kind, (was, now) in sorted(better.items()):
              print(f"improved: {kind} {was} -> {now}")
          if better and not worse:
              print("\nLower .github/status-baseline.json to lock these in.")

          if worse:
              print("\nThis change introduces new findings:\n")
              for kind, (was, now) in sorted(worse.items()):
                  print(f"  {kind}: {was} -> {now}")
              print("\nRun `python manage.py status --brief` locally to see them.")
              sys.exit(1)
          print("\nno new findings")
          PY
