name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Hooks and their pins come from .pre-commit-config.yaml, so CI and the local hook
      # cannot drift apart. It also runs end-of-file-fixer, which CI never did - the local
      # hook only sees staged files, so eight files had been sitting unfixed.
      - uses: pre-commit/action@v3.0.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the provenance tests walk real history; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/ -q

  artifacts:
    # index.json and schema.json are generated. Regenerating and diffing is the only way
    # a committed artifact cannot drift from the files it describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction
      - run: poetry run python manage.py index --check

  onchain:
    # Only the chains this PR touched, and only on chain. The offline checks run in `drift`
    # for every chain; this catches a hand-edited address, which nothing offline can.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --changed-since diffs against the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction

      - name: Probe the chains this branch changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          poetry run python manage.py status --changed-since "$base" --onchain --wiring --json touched.json || true
          test -f touched.json # no findings still writes a file; a missing one is a broken job

      # --scope all: the nightly run ignores devnet because it churns, but a PR that edited
      # a devnet file is asking about exactly that chain.
      - name: Render the report
        id: report
        run: |
          poetry run python manage.py monitor touched.json --scope all --body onchain.md
          # monitor writes the file either way; empty means nothing deviated.
          test -s onchain.md && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Post
        if: steps.report.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: onchain-touched
          path: onchain.md

      - name: Clear
        if: steps.report.outputs.found == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: onchain-touched
          delete: true

  drift:
    # Compares this branch against its base rather than a committed count: a fix needs no
    # bookkeeping, a new contract version reads as new work, and a fault already on the base
    # branch never fails a PR that did not cause it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # get_latest_commit_hash needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction

      # Offline checks only - no RPC, no credentials, fully deterministic.
      - name: Report deployment status
        run: poetry run python manage.py status --brief || true

      - name: Findings on this branch
        run: poetry run python manage.py status --json head.json || true

      - name: Findings on the base branch
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git worktree add --detach .tmp/base "$base"
          # This branch's checks against the base branch's data, so a change to the tool
          # cannot read as a change in what it found.
          cp -r scripts manage.py .tmp/base/
          cp settings/models.py .tmp/base/settings/models.py
          # Run from here, not `cd .tmp/base`: poetry resolves its virtualenv from the current
          # directory's pyproject.toml, and only this one has been installed. The script's own
          # location still decides BASE_DIR, so it reads the base branch's files.
          poetry run python .tmp/base/manage.py status --json base.json || true
          test -s base.json # a missing base is a broken job, not "everything is new"

      - name: Compare
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          set +e
          poetry run python manage.py compare base.json head.json --output report.md
          code=$?
          set -e
          # 0 clean, 1 new blocking findings, anything else means compare itself failed.
          if [ "$code" -gt 1 ]; then
            echo "compare exited $code - the comparison did not run"
            exit "$code"
          fi
          echo "blocking=$code" >> "$GITHUB_OUTPUT"
          if [ -s report.md ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error: a fork PR cannot write comments, and that must not fail the run.
      - name: Post summary
        if: steps.compare.outputs.has_report == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: deployment-status
          path: report.md

      - name: Clear summary
        if: steps.compare.outputs.has_report == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: deployment-status
          delete: true

      - name: Fail on new blocking findings
        if: steps.compare.outputs.blocking != '0' && steps.compare.outputs.blocking != ''
        run: |
          echo "New CONFIG or REQUIRED findings - see the PR comment."
          exit 1
