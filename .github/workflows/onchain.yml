name: on-chain health

# A deviation appears when someone touches a chain, not when someone opens a PR here.
# GitHub disables a public repo's scheduled workflow after 60 days with no activity.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  LABEL: onchain-health
  TITLE: "On-chain deviations"

jobs:
  probe:
    runs-on: ubuntu-latest
    # --bytecode recompiles every distinct contract, which is most of the runtime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # source_provenance walks history to tell current source from drifted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry==1.8.3
      - run: poetry install --no-interaction

      # Keyed on the versions themselves: a new compiler in a deployment file misses the
      # cache and installs, an unchanged fleet reuses it.
      - name: Cache vyper compilers
        id: compilers
        uses: actions/cache@v4
        with:
          path: ~/.vvm
          key: vvm-${{ hashFiles('deployments/**/*.yaml') }}
          restore-keys: vvm-

      - name: Install the compilers the fleet records
        run: |
          poetry run python -c "
          import vvm
          from scripts.status import recorded_compilers
          for version in recorded_compilers():
              print(f'installing vyper {version}')
              vvm.install_vyper(version)
          "

      # No secrets: every probe goes to the public_rpc_url the deployment file records.
      # --from-commit because sources move on: without it 12 chains report every row as
      # "cannot be compared", and the question here is whether the chain matches what we
      # recorded deploying, not whether today's file still compiles to it.
      - name: Probe every chain
        run: poetry run python manage.py status --onchain --wiring --bytecode --from-commit --json onchain.json || true

      - name: Find the open issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number -q '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body -q .body > previous.md
          else
            : > previous.md
          fi

      - name: Render the report
        run: |
          poetry run python manage.py monitor onchain.json \
            --previous previous.md --body body.md --delta delta.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The issue is the alert, so the job stays green - a permanently red nightly is ignored.
      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ ! -s body.md ]; then
            if [ -n "$NUMBER" ]; then
              gh issue close "$NUMBER" --comment "Every probe clean - reopening automatically if that changes."
            fi
            exit 0
          fi
          if [ -z "$NUMBER" ]; then
            gh label create "$LABEL" --color FBCA04 --description "nightly on-chain probe" 2>/dev/null || true
            # Opening notifies and editing does not; that is the whole notification model.
            gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
            exit 0
          fi
          gh issue edit "$NUMBER" --body-file body.md
          if [ -s delta.md ]; then
            gh issue comment "$NUMBER" --body-file delta.md
          fi
